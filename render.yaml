services:
  - type: web
    name: ashen-roads
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: AUTH_SECRET          # fixed token-signing key (generated once by Render)
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL     # FREE database that keeps the accounts (see README -> Live hosting)
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY       # Email verification codes (see README)
        sync: false
      - key: SMTP_USER            # OR send the codes with Gmail: address ...
        sync: false
      - key: SMTP_PASS            # ... and its 16-letter app password
        sync: false
      - key: EMAIL_FROM           # Verified sender, e.g. Ashen Roads <noreply@yourdomain.com>
        sync: false
      - key: ADMIN_USERNAME      # Exact account name allowed to open admin.html; leave unset to disable admin
        sync: false
